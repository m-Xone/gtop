[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtop"
version = "1.1.0"
description = "CPU + NVIDIA GPU monitor with colored progress bars."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "m-Xone" }]
keywords = ["gpu", "nvidia", "monitoring", "curses", "tui", "nvidia-smi"]
dependencies = ["psutil>=5.9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-psutil",
]

[project.urls]
Homepage = "https://github.com/m-Xone/gtop"
Repository = "https://github.com/m-Xone/gtop"
Issues = "https://github.com/m-Xone/gtop/issues"

[project.scripts]
gtop = "gtop.cli:main"

[tool.setuptools]
packages = ["gtop"]

[tool.setuptools.package-data]
gtop = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "tty: tests that require a real terminal / pty to run curses",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # nvidia-smi's XML schema varies by driver version, so every metric parse
    # is wrapped in a deliberate catch-all that degrades to "[data not
    # available]" rather than taking down the render loop.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately poke at private helpers and build odd inputs.
"tests/*" = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
# No python_version pin: current mypy refuses to target 3.9, and the runtime
# floor is enforced where it actually matters — ruff's target-version for
# syntax, and a real 3.9 job in CI.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Annotations are required in the package itself. Test bodies are exempt --
# pytest fixtures make full annotation mostly noise -- but they are still
# checked for actual type errors via check_untyped_defs above.
module = "gtop.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# ElementTree's find() returns Optional[Element] and .text is Optional[str].
# Chained access is intentional here: each metric parser is wrapped in a
# try/except that converts any failure into a "[data not available]" row,
# so guarding every link would add noise without changing behavior.
module = "gtop.views"
disable_error_code = ["union-attr"]

